<style>

/* LUNA AREA — RIGHT SIDE */
#luna-zone {
    position: fixed;
    right: 5px;
    bottom: 5px;

    width: 380px;
    height: 330px;

    z-index: 999999;
    pointer-events: none;
}


/* LUNA — FLIPPED TO FACE RIGHT */
#luna {
    position: absolute;

    right: 0;
    bottom: 0;

    width: 350px;
    height: auto;

    opacity: 0;

    cursor: pointer;
    pointer-events: auto;

    user-select: none;
    -webkit-user-drag: none;

    filter:
        drop-shadow(0 7px 12px rgba(0,0,0,.30))
        drop-shadow(0 0 15px rgba(160,80,255,.65));

    animation:
        lunaComeIn 3s ease-out forwards,
        lunaPlay 4s ease-in-out 3s infinite;
}


/* =====================================
   ENTER FROM RIGHT + FACE RIGHT
===================================== */

@keyframes lunaComeIn {

    0% {
        opacity: 0;

        transform:
            translateX(110vw)
            rotate(-5deg)
            scale(.65)
            scaleX(-1);
    }

    20% {
        opacity: 1;
    }

    55% {
        transform:
            translateX(100px)
            translateY(-10px)
            rotate(4deg)
            scale(.90)
            scaleX(-1);
    }

    75% {
        transform:
            translateX(-25px)
            translateY(-20px)
            rotate(-3deg)
            scale(1.05)
            scaleX(-1);
    }

    90% {
        transform:
            translateX(8px)
            rotate(2deg)
            scale(.98)
            scaleX(-1);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(0)
            rotate(0deg)
            scale(1)
            scaleX(-1);
    }
}


/* =====================================
   PLAYING AFTER SHE ARRIVES
===================================== */

@keyframes lunaPlay {

    0%, 100% {
        transform:
            translate(0,0)
            rotate(0deg)
            scaleX(-1);
    }

    25% {
        transform:
            translate(-10px,-8px)
            rotate(2deg)
            scaleX(-1);
    }

    50% {
        transform:
            translate(-30px,-18px)
            rotate(-3deg)
            scaleX(-1);
    }

    75% {
        transform:
            translate(-12px,-8px)
            rotate(2deg)
            scaleX(-1);
    }
}


/* =====================================
   CLICK LUNA — POUNCE
===================================== */

#luna.pounce {
    opacity: 1;

    animation:
        lunaPounce .8s ease,
        lunaPlay 4s ease-in-out .8s infinite;
}


@keyframes lunaPounce {

    0% {
        transform:
            translate(0,0)
            scale(1)
            scaleX(-1);
    }

    30% {
        transform:
            translate(-60px,-45px)
            rotate(-6deg)
            scale(1.10)
            scaleX(-1);
    }

    55% {
        transform:
            translate(-85px,-5px)
            rotate(5deg)
            scale(1.05)
            scaleX(-1);
    }

    80% {
        transform:
            translate(-20px,-15px)
            rotate(-3deg)
            scaleX(-1);
    }

    100% {
        transform:
            translate(0,0)
            scale(1)
            scaleX(-1);
    }
}


/* MOBILE */

@media (max-width: 600px) {

    #luna-zone {
        width: 230px;
        height: 210px;

        right: 0;
        bottom: 0;
    }

    #luna {
        width: 215px;
    }

}

</style>


<div id="luna-zone">

    <img
        id="luna"
        src="./Luna.PNG"
        alt="Luna"
    >

</div>


<script>

const luna = document.getElementById("luna");

luna.addEventListener("click", function () {

    luna.classList.remove("pounce");

    void luna.offsetWidth;

    luna.classList.add("pounce");

});

</script>
