<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}


/* =========================
   LUNA AREA
========================= */

#luna-zone {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    pointer-events: none;
}


/* =========================
   LUNA
========================= */

#luna {
    position: absolute;

    left: 0;
    bottom: 10px;

    width: 350px;
    height: auto;

    pointer-events: auto;
    cursor: pointer;

    user-select: none;
    -webkit-user-drag: none;

    filter:
        drop-shadow(0 7px 12px rgba(0,0,0,.30))
        drop-shadow(0 0 15px rgba(160,80,255,.65));

    animation:
        lunaCrossScreen 7s ease-in-out forwards,
        lunaPlay 3s ease-in-out 7s infinite;
}


/* =========================
   SPEECH BUBBLE
========================= */

#luna-speech {
    position: absolute;

    right: 260px;
    bottom: 250px;

    width: 220px;

    padding: 15px 18px;

    border-radius: 20px;

    background: white;
    color: #27103f;

    font-family: Arial, sans-serif;
    font-size: 16px;
    font-weight: 800;
    text-align: center;

    box-shadow:
        0 5px 18px rgba(0,0,0,.25),
        0 0 18px rgba(165,90,255,.6);

    opacity: 0;

    animation:
        showLunaSpeech .5s ease 7.5s forwards;

    pointer-events: none;
}


#luna-speech::after {
    content: "";

    position: absolute;

    right: 30px;
    bottom: -17px;

    border-width: 18px 12px 0 12px;
    border-style: solid;

    border-color:
        white
        transparent
        transparent
        transparent;
}


@keyframes showLunaSpeech {

    from {
        opacity: 0;
        transform: translateY(15px) scale(.9);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================
   CROSS SCREEN
========================= */

@keyframes lunaCrossScreen {

    0% {
        opacity: 0;

        transform:
            translateX(-400px)
            scaleX(-1);
    }

    10% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(-10px)
            scaleX(-1)
            rotate(2deg);
    }

    25% {
        transform:
            translateX(20vw)
            translateY(-35px)
            scaleX(-1)
            rotate(-3deg);
    }

    40% {
        transform:
            translateX(38vw)
            translateY(0)
            scaleX(-1)
            rotate(2deg);
    }

    55% {
        transform:
            translateX(52vw)
            translateY(-45px)
            scaleX(-1)
            rotate(-4deg);
    }

    70% {
        transform:
            translateX(65vw)
            translateY(-5px)
            scaleX(-1)
            rotate(3deg);
    }

    85% {
        transform:
            translateX(calc(100vw - 390px))
            translateY(-25px)
            scaleX(-1)
            rotate(-2deg);
    }

    100% {
        opacity: 1;

        transform:
            translateX(calc(100vw - 370px))
            translateY(0)
            scaleX(-1);
    }
}


/* =========================
   PLAY
========================= */

@keyframes lunaPlay {

    0%,100% {

        transform:
            translateX(calc(100vw - 370px))
            translateY(0)
            scaleX(-1);
    }

    50% {

        transform:
            translateX(calc(100vw - 400px))
            translateY(-20px)
            scaleX(-1)
            rotate(-3deg);
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    #luna {

        width: 190px;

        animation:
            lunaCrossMobile 6s ease-in-out forwards,
            lunaPlayMobile 3s ease-in-out 6s infinite;
    }


    #luna-speech {

        width: 155px;

        right: 125px;
        bottom: 165px;

        font-size: 13px;

        padding: 11px 13px;

        animation:
            showLunaSpeech .5s ease 6.5s forwards;
    }


    @keyframes lunaCrossMobile {

        0% {

            opacity: 0;

            transform:
                translateX(-220px)
                scaleX(-1);
        }

        10% {

            opacity: 1;

            transform:
                translateX(-10px)
                scaleX(-1);
        }

        35% {

            transform:
                translateX(30vw)
                translateY(-25px)
                scaleX(-1);
        }

        60% {

            transform:
                translateX(55vw)
                scaleX(-1);
        }

        100% {

            opacity: 1;

            transform:
                translateX(calc(100vw - 195px))
                scaleX(-1);
        }

    }


    @keyframes lunaPlayMobile {

        0%,100% {

            transform:
                translateX(calc(100vw - 195px))
                scaleX(-1);
        }

        50% {

            transform:
                translateX(calc(100vw - 215px))
                translateY(-15px)
                scaleX(-1);
        }

    }

}

</style>
</head>


<body>


<div id="luna-zone">


    <!-- SPEECH -->

    <div id="luna-speech">
        ✨ Psst! Click me to check out Luna's Freebies! 🌙
    </div>


    <!-- LUNA -->

    <img
        id="luna"
        src="./Luna.PNG"
        alt="Luna"
        onclick="window.open(
        'https://payhip.com/MoonlightDesigns87/collection/luna-s-freebies',
        '_top'
        )"
    >


</div>


</body>
</html>
