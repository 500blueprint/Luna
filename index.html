<style>

/* LUNA AREA */
#luna-zone {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;

    z-index: 999999;
    pointer-events: none;
}


/* LUNA */
#luna {
    position: absolute;

    left: 0;
    bottom: 10px;

    width: 350px;
    height: auto;

    pointer-events: auto;
    cursor: pointer;

    user-select: none;
    -webkit-user-drag: none;

    filter:
        drop-shadow(0 7px 12px rgba(0,0,0,.30))
        drop-shadow(0 0 15px rgba(160,80,255,.65));

    /*
       scaleX(-1) FLIPS LUNA
       so she faces RIGHT
    */

    animation:
        lunaCrossScreen 7s ease-in-out forwards,
        lunaPlay 3s ease-in-out 7s infinite;
}


/* ========================================
   LUNA CROSSES LEFT ---> RIGHT
======================================== */

@keyframes lunaCrossScreen {

    /* starts off screen LEFT */
    0% {
        opacity: 0;

        transform:
            translateX(-400px)
            translateY(0)
            scaleX(-1)
            rotate(0deg);
    }


    /* enters screen */
    10% {
        opacity: 1;

        transform:
            translateX(0)
            translateY(-10px)
            scaleX(-1)
            rotate(2deg);
    }


    /* little playful hop */
    25% {
        transform:
            translateX(20vw)
            translateY(-35px)
            scaleX(-1)
            rotate(-3deg);
    }


    40% {
        transform:
            translateX(38vw)
            translateY(0)
            scaleX(-1)
            rotate(2deg);
    }


    /* another little pounce */
    55% {
        transform:
            translateX(52vw)
            translateY(-45px)
            scaleX(-1)
            rotate(-4deg);
    }


    70% {
        transform:
            translateX(65vw)
            translateY(-5px)
            scaleX(-1)
            rotate(3deg);
    }


    /* approaches right side */
    85% {
        transform:
            translateX(calc(100vw - 390px))
            translateY(-25px)
            scaleX(-1)
            rotate(-2deg);
    }


    /* settles on RIGHT */
    100% {
        opacity: 1;

        transform:
            translateX(calc(100vw - 370px))
            translateY(0)
            scaleX(-1)
            rotate(0deg);
    }
}


/* ========================================
   PLAY AFTER SHE REACHES RIGHT
======================================== */

@keyframes lunaPlay {

    0%, 100% {
        transform:
            translateX(calc(100vw - 370px))
            translateY(0)
            scaleX(-1)
            rotate(0deg);
    }


    25% {
        transform:
            translateX(calc(100vw - 385px))
            translateY(-12px)
            scaleX(-1)
            rotate(2deg);
    }


    50% {
        transform:
            translateX(calc(100vw - 405px))
            translateY(-25px)
            scaleX(-1)
            rotate(-3deg);
    }


    75% {
        transform:
            translateX(calc(100vw - 380px))
            translateY(-8px)
            scaleX(-1)
            rotate(2deg);
    }
}


/* ========================================
   MOBILE
======================================== */

@media (max-width: 600px) {

    #luna {
        width: 190px;

        animation:
            lunaCrossMobile 6s ease-in-out forwards,
            lunaPlayMobile 3s ease-in-out 6s infinite;
    }


    @keyframes lunaCrossMobile {

        0% {
            opacity: 0;

            transform:
                translateX(-220px)
                scaleX(-1);
        }


        10% {
            opacity: 1;

            transform:
                translateX(-10px)
                translateY(-5px)
                scaleX(-1);
        }


        35% {
            transform:
                translateX(30vw)
                translateY(-25px)
                scaleX(-1)
                rotate(-3deg);
        }


        60% {
            transform:
                translateX(55vw)
                translateY(0)
                scaleX(-1)
                rotate(3deg);
        }


        80% {
            transform:
                translateX(calc(100vw - 210px))
                translateY(-20px)
                scaleX(-1);
        }


        100% {
            opacity: 1;

            transform:
                translateX(calc(100vw - 195px))
                translateY(0)
                scaleX(-1);
        }
    }


    @keyframes lunaPlayMobile {

        0%, 100% {
            transform:
                translateX(calc(100vw - 195px))
                translateY(0)
                scaleX(-1);
        }


        50% {
            transform:
                translateX(calc(100vw - 215px))
                translateY(-15px)
                scaleX(-1)
                rotate(-3deg);
        }
    }

}

</style>


<div id="luna-zone">

    <img
        id="luna"
        src="./Luna.PNG"
        alt="Luna"
    >

</div>
